name: Build Debug App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        # The repo only tracks lib/, test/ and pubspec.yaml
        run: |
          flutter create --platforms=android --project-name openbird --org org.openbird .
          mkdir -p assets/images assets/icons
          rm -f test/widget_test.dart
          # flutter create only adds INTERNET to the debug/profile manifests; release builds need it too
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test

      - name: Build debug APK
        # API_DOMAIN / SITE_DOMAIN: repository variables (Settings > Secrets and variables > Actions > Variables)
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          DEFINES=""
          [ -n "$API_DOMAIN" ] && DEFINES="$DEFINES --dart-define=API_BASE_URL=https://$API_DOMAIN"
          [ -n "$SITE_DOMAIN" ] && DEFINES="$DEFINES --dart-define=SITE_URL=https://$SITE_DOMAIN"
          echo "dart-defines:$DEFINES"
          flutter build apk --debug $DEFINES

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbird-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Attach APK to the commit's Build release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::8}
          cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk "openbird-debug-${SHORT}.apk"
          # The Release Exports workflow creates the "Build <date>-<sha>" release for this commit
          for i in $(seq 1 30); do
            TAG=$(gh release list --limit 30 --json tagName -q ".[].tagName" | grep -E -- "-${SHORT}$" | grep -v '^app-debug' | head -1 || true)
            [ -n "$TAG" ] && break
            echo "Waiting for Build release ($i/30)..."; sleep 20
          done
          if [ -z "$TAG" ]; then
            TAG="app-debug-$(date -u +'%Y-%m-%d-%H-%M')-${SHORT}"
            gh release create "$TAG" --prerelease --title "Debug app $TAG" --notes "Debug APK built from commit ${GITHUB_SHA}."
          fi
          gh release upload "$TAG" "openbird-debug-${SHORT}.apk" --clobber
          echo "Attached APK to $TAG"

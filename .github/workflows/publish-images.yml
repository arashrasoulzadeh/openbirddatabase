name: Publish Images

# Builds the website and API Docker images on GitHub's runners and publishes them to GitHub Container Registry,
# so the server only has to download them (./deploy.sh) instead of compiling anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: frontend
            file: frontend/Dockerfile
          - name: api
            context: .
            file: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check the domain variables (the website image has them baked in)
        if: matrix.name == 'web'
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -z "$API_DOMAIN" ] || [ -z "$SITE_DOMAIN" ]; then
            echo "::error::Set the repository variables API_DOMAIN and SITE_DOMAIN (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # lower-cased automatically; the commit is stored in the org.opencontainers.image.revision label
          images: ghcr.io/${{ github.repository_owner }}/openbird-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (website, with the public URLs baked in)
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.SITE_DOMAIN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build and push (API)
        if: matrix.name == 'api'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

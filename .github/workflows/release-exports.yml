name: Release Exports

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-exports:
    name: Generate Export Files
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
      commit_short: ${{ steps.vars.outputs.commit_short }}
      commit_date: ${{ steps.vars.outputs.commit_date }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
      artifact_tag: ${{ steps.vars.outputs.artifact_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Set commit variables
        id: vars
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "commit_short=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
          # Release tag format: YYYY-MM-DD-HH-MM-commithash (valid for GitHub)
          echo "release_tag=$(date -u +'%Y-%m-%d-%H-%M')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          # Artifact-safe format (same as release_tag now)
          echo "artifact_tag=$(date -u +'%Y-%m-%d-%H-%M')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          # Human-readable date for display
          echo "commit_date=$(date -u +'%Y/%-m/%-d-%H:%M')" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml tqdm

      - name: Generate exports
        run: |
          python _scripts/export_unified.py
        working-directory: ${{ github.workspace }}

      - name: Package translations per language
        run: |
          if [ -d "translations" ]; then
            for lang_dir in translations/*/; do
              lang=$(basename "$lang_dir")
              count=$(find "$lang_dir" -name '*.md' | wc -l)
              if [ "$count" -gt 0 ]; then
                tar -czf "exports/translations-${lang}.tar.gz" "$lang_dir"
                echo "Packaged $lang: $count files ($(du -h exports/translations-${lang}.tar.gz | cut -f1))"
              else
                echo "No files for $lang, skipping"
              fi
            done
            # Also create combined
            tar -czf exports/translations-all.tar.gz translations/
            echo "Combined: $(du -h exports/translations-all.tar.gz | cut -f1)"
          else
            echo "No translations directory"
            touch exports/translations-all.tar.gz
          fi

      - name: Filter empty translation files
        run: |
          # Remove empty translation archives
          for f in exports/translations-*.tar.gz; do
            if [ -f "$f" ] && [ ! -s "$f" ]; then
              echo "Removing empty file: $f"
              rm "$f"
            fi
          done
          # Also check combined
          if [ -f exports/translations-all.tar.gz ] && [ ! -s exports/translations-all.tar.gz ]; then
            echo "Removing empty combined translations file"
            rm exports/translations-all.tar.gz
          fi

      - name: Verify export files
        run: |
          ls -la exports/
          for f in exports/*; do
            echo "File: $(basename $f), Size: $(du -h $f | cut -f1)"
          done

      - name: Build release file list
        id: release-files
        run: |
          FILES=""
          for f in exports/all_birds.csv exports/all_birds_compact.csv exports/all_birds.xlsx exports/all_birds.sqlite; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              FILES="$FILES $f"
            fi
          done
          for f in exports/translations-*.tar.gz; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              FILES="$FILES $f"
            fi
          done
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload exports as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bird-exports-${{ steps.vars.outputs.artifact_tag }}
          path: exports/*
          retention-days: 30
          compression-level: 6

      - name: Create/Update continuous release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: "Build ${{ steps.vars.outputs.release_tag }}"
          body: |
            Automated build from commit ${{ github.sha }}
            
            **Commit:** ${{ github.sha }}
            **Date:** ${{ steps.vars.outputs.commit_date }}
            **Branch:** ${{ github.ref_name }}
            
            Contains exports for all 11,149+ bird species.
          files: ${{ steps.release-files.outputs.files }}
          draft: false
          prerelease: true
          make_latest: true

      - name: Upload exports as release assets (for tagged releases)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ steps.release-files.outputs.files }}
          tag_name: ${{ github.event.release.tag_name }}

  create-sql-dump:
    name: Create SQL Dump
    runs-on: ubuntu-latest
    needs: generate-exports
    steps:
      - name: Download exports artifact
        uses: actions/download-artifact@v4
        with:
          name: bird-exports-${{ needs.generate-exports.outputs.artifact_tag }}
          path: exports/

      - name: Create SQL dump
        run: |
          sqlite3 exports/all_birds.sqlite .dump > exports/all_birds.sql
          gzip -k exports/all_birds.sql
          echo "SQL dump created: $(du -h exports/all_birds.sql | cut -f1)"
          echo "Gzipped: $(du -h exports/all_birds.sql.gz | cut -f1)"

      - name: Upload SQL dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bird-sql-dump-${{ needs.generate-exports.outputs.artifact_tag }}
          path: |
            exports/all_birds.sql
            exports/all_birds.sql.gz
          retention-days: 30

      - name: Upload SQL dump to continuous release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-exports.outputs.release_tag }}
          files: |
            exports/all_birds.sql
            exports/all_birds.sql.gz

      - name: Upload SQL dump to tagged release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            exports/all_birds.sql
            exports/all_birds.sql.gz

  create-yaml-export:
    name: Create YAML Export
    runs-on: ubuntu-latest
    needs: generate-exports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml

      - name: Download exports artifact
        uses: actions/download-artifact@v4
        with:
          name: bird-exports-${{ needs.generate-exports.outputs.artifact_tag }}
          path: exports/

      - name: Create YAML export
        run: |
          python _scripts/create_yaml_export.py
        working-directory: ${{ github.workspace }}

      - name: Upload YAML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bird-yaml-export-${{ needs.generate-exports.outputs.artifact_tag }}
          path: |
            exports/all_birds.yaml
            exports/all_birds.yaml.gz
          retention-days: 30

      - name: Upload YAML to continuous release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-exports.outputs.release_tag }}
          files: |
            exports/all_birds.yaml
            exports/all_birds.yaml.gz

      - name: Upload YAML to tagged release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            exports/all_birds.yaml
            exports/all_birds.yaml.gz
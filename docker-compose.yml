# Production stack: Caddy (HTTPS) -> website + API, with MeiliSearch internal.
# Configure domains in .env (see .env.example), then: docker compose up -d --build
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      - API_DOMAIN=${API_DOMAIN:?set API_DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

  web:
    # Prebuilt by CI (publish-images.yml); `docker compose up -d --build` builds it locally instead
    image: ${IMAGE_PREFIX:-ghcr.io/arashrasoulzadeh}/openbird-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    environment:
      # Server-side rendering talks to the API over the internal network
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/arashrasoulzadeh}/openbird-api:${IMAGE_TAG:-latest}
    build: .
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - SITE_DOMAIN=${SITE_DOMAIN}
      # hybrid keyword + vector search; set VECTOR_SEARCH=false to disable
      - VECTOR_SEARCH=${VECTOR_SEARCH:-true}
      - SEMANTIC_RATIO=${SEMANTIC_RATIO:-0.5}
      - REDIS_URL=redis://redis:6379/0
      # analytics events live in SQLite on a volume; the token protects the dashboard data
      - ANALYTICS_DB=/data/analytics.db
      - ANALYTICS_TOKEN=${ANALYTICS_TOKEN:-}
      - ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-true}
      # refreshed by the worker onto the shared analytics volume
      - CONTENT_STATS_FILE=/data/content-stats.json
      - API_WORKERS=${API_WORKERS:-2}
      # a busy MeiliSearch (vector indexing) must not freeze the API: searches time out and fall back
      - MEILI_TIMEOUT=${MEILI_TIMEOUT:-3}
      - FAST_SEARCH=${FAST_SEARCH:-true}
      - HYBRID_TIMEOUT=${HYBRID_TIMEOUT:-1.5}
      - MEILI_POOL_SIZE=${MEILI_POOL_SIZE:-2}
    depends_on:
      # Redis is enough to start: MeiliSearch is optional at runtime (in-memory search + circuit breaker).
      - redis
    volumes:
      # species data and indexes are inside the image, so code and data always match; only analytics is stored
      - analytics_data:/data
    restart: unless-stopped

  # Response cache for the API (species, search, taxonomy...). Safe to wipe: it refills on demand.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-768mb}", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    restart: unless-stopped

  # Backend jobs: cache warm-up (on boot + hourly), analytics backup, content-stats refresh.
  # Deploy does not warm the cache — this worker owns that.
  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/arashrasoulzadeh}/openbird-api:${IMAGE_TAG:-latest}
    command: python _scripts/worker.py
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_URL=http://api:8000
      - ANALYTICS_DB=/data/analytics.db
      - ANALYTICS_BACKUP_DIR=/data/backups
      - ANALYTICS_BACKUP_KEEP=${ANALYTICS_BACKUP_KEEP:-14}
      - CONTENT_STATS_FILE=/data/content-stats.json
      - JOBS=${WORKER_JOBS:-cache,analytics_backup,content_stats}
      - CACHE_EVERY=${CACHE_EVERY:-3600}
      - BACKUP_EVERY=${BACKUP_EVERY:-86400}
      - STATS_EVERY=${STATS_EVERY:-86400}
    depends_on:
      - redis
      - api
    volumes:
      - analytics_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      - MEILI_NO_ANALYTICS=true
      # computing vectors is CPU heavy: leave room for the other services on a shared server
      - MEILI_MAX_INDEXING_THREADS=${MEILI_INDEXING_THREADS:-2}
      # lets the newer engine open data created by an older version (the index is rebuildable anyway)
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE=true
    volumes:
      - ./meili_data:/meili_data
    # Cap RAM so a vector reindex cannot OOM the whole host (API/web keep serving without Meili).
    mem_limit: ${MEILI_MEMORY:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Optional: populate MeiliSearch (docker compose --profile indexing run --rm indexer)
  indexer:
    image: ${IMAGE_PREFIX:-ghcr.io/arashrasoulzadeh}/openbird-api:${IMAGE_TAG:-latest}
    command: python _scripts/populate_meili.py
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - VECTOR_SEARCH=${VECTOR_SEARCH:-true}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-intfloat/multilingual-e5-small}
    depends_on:
      - meilisearch
    profiles:
      - indexing

volumes:
  analytics_data:
  caddy_data:
  caddy_config:

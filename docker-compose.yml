version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.7
    ports:
      - "7700:7700"
    environment:
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MEILI_HOST=http://meilisearch:7700
    depends_on:
      - meilisearch
    volumes:
      - ./birds:/app/birds
      - ./translations:/app/translations
      - ./_index:/app/_index
    restart: unless-stopped

  # Optional: Indexer service to populate MeiliSearch
  indexer:
    build: .
    command: python _scripts/populate_meili.py
    environment:
      - MEILI_HOST=http://meilisearch:7700
    depends_on:
      - meilisearch
    volumes:
      - ./_index:/app/_index
    profiles:
      - indexing